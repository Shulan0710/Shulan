    <script>
       const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        let audioCtx, masterGain, delayNode, feedbackGain;
        function initAudio() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain(); masterGain.gain.value = 0.3; masterGain.connect(audioCtx.destination);
                delayNode = audioCtx.createDelay(); delayNode.delayTime.value = 0.25;
                feedbackGain = audioCtx.createGain(); feedbackGain.gain.value = 0.3;
                delayNode.connect(feedbackGain); feedbackGain.connect(delayNode); delayNode.connect(masterGain);
            } catch(e) {}
        }
        document.addEventListener('mousedown', initAudio, { once: true });
        document.addEventListener('mousemove', initAudio, { once: true });

        function playSound(freq, type, duration, volume) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.02); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(masterGain); gain.connect(delayNode);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }
        function playCollectSound(combo) { const scale = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66]; playSound(scale[Math.min(combo, scale.length - 1)], 'sine', 0.5, 0.4); }
        function playJellyfishSound() { [880, 1046.5, 1318.5].forEach((f, i) => setTimeout(() => playSound(f, 'sine', 0.8, 0.4), i * 100)); }
        function playBubbleSound() { playSound(900, 'sine', 0.2, 0.5); }
        function playDarkSound() { playSound(50, 'triangle', 0.4, 0.6); }
        function playSkillSound() { playSound(100, 'sawtooth', 0.5, 0.3); }
        function playMessageSound() { [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => setTimeout(() => playSound(f, 'triangle', 1.5, 0.3), i * 150)); }

        let mouse = { x: width / 2, y: height / 2 };
        document.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });

        let entities = [], particles = [], shockwaves = [], floatingTexts = [];
        let ambientStars = []; 
        let healingScore = 0, gameActive = true, isPaused = false;
        let combo = 0, lastCollectTime = 0, shakeTime = 0;
        let level = 1;
        let maxLevel = parseInt(localStorage.getItem('gameMaxLevel')) || 1;
        let currentThreshold = 100; 
        let skillCD = 0, SKILL_MAX_CD = 600; 
        let messageCount = 0, QUIZ_TRIGGER_AFTER = 3; 
        let totalRecords = 0; 

        for (let i = 0; i < 50; i++) {
            ambientStars.push({ x: Math.random() * width, y: Math.random() * height, size: Math.random() * 2, alpha: Math.random() * 0.5 + 0.1, speed: Math.random() * 0.2 + 0.05 });
        }

        const myPersonalMessages = [
            "辛苦了，请站起来，因为你的屁股扁了。", "先别玩了，喝水，120ml！", "现在马上给苇清发送一条消息。", "不想上班了…喊派出所开枪打了！", "iloveyou！", "(´･ω･`)", "起来休息一下！", "这么无聊的游戏也能坚持玩这么久吗…", "⁄(⁄ ⁄ ⁄ω⁄ ⁄ ⁄)⁄", "伸展四肢。脑袋转一转。", "这游戏都被你玩穿了，快退下吧！", "是不是觉得这游戏很简单？有本事你一次不答错呀！", "快看，你的屏幕上有蚊子！（骗你的）", "你无敌了，这都不去休息，是要卷死谁？", "无论发生什么，我都会一直支持你的。", "你已经做得很棒了，不要对自己太苛刻。", "累了就休息一下，天塌下来还有高个子顶着呢。", "别焦虑，慢慢来，比较快。", "不管世界怎么变，我都在你身边。", "你的鼠标跑得比博尔特还快，平时摸鱼没少练吧？", "被老板发现了没？", "你是不是以为这游戏没有尽头？恭喜你，猜对了！", "要是当年学习有这个劲头，清北都考上了吧？（开玩笑的）"
        ];

        const quizQuestions = [
            { type: 'choice', question: "苇清什么星座？", options: ["A. 金牛座", "B. 巨蟹座", "C. 天秤座", "D. 双子座"], answer: 2 },
            { type: 'choice', question: "树懒最喜欢", options: ["A. 喝冰饮", "B. 睡懒觉", "C. 发呆", "D. 做PPT"], answer: 1 },
            { type: 'choice', question: "树懒本人的性格", options: ["A. 非常可爱非常温柔体贴细心", "B. 非常暴躁", "C. 很烦人！（敢选就死定啦◉‿◉）", "D. 人还好吧"], answer: 0 },
            { type: 'choice', question: "树懒最喜欢的歌手", options: ["A. 陈绮贞", "B. 薛之谦", "C. 许嵩", "D. 邓紫棋"], answer: 2 },
            { type: 'choice', question: "我最喜欢的颜色？", options: ["A. 紫色", "B. 蓝色", "C. 白色", "D. 五颜六色"], answer: 2 },
            { type: 'choice', question: "我最喜欢的食物是什么？", options: ["A. 奶茶", "B. 咖啡", "C. 寿司", "D. 烤肉"], answer: 1 }
        ];

        const angryEmojis = ["(╯°□°）╯︵ ┻━┻", "(ノಠ益ಠ)ノ", "ヽ(｀⌒´)ノ", "(＃`Д´)", "(￣_￣|||)", "┑(￣Д ￣)┍", "(；一_一)", "(・_・;)"];

        function updateLevelDisplay() { document.getElementById('levelBadge').innerText = `Lv.${level} (最高: Lv.${maxLevel})`; }

        function createEntity() {
            let r = Math.random(), type = 'star';
            let darkChance = Math.min(0.1 + (level - 1) * 0.03, 0.5);
            if (r < darkChance) type = 'dark'; 
            else if (r < darkChance + 0.1) type = 'jellyfish'; 
            else if (r < darkChance + 0.15) type = 'bubble'; 
            else if (r < darkChance + 0.20) type = 'heart'; 
            let isRare = type === 'star' && Math.random() < 0.15;
            let speedMult = Math.min(1 + (level - 1) * 0.15, 3); 
            entities.push({
                type: type, x: Math.random() * width, y: type === 'jellyfish' ? height + 20 : Math.random() * height, 
                vx: type === 'jellyfish' ? (Math.random() - 0.5) * 1 * speedMult : (Math.random() - 0.5) * (1 + totalRecords * 0.01) * speedMult, 
                vy: type === 'jellyfish' ? (-0.5 - Math.random() * 1) * speedMult : (Math.random() - 0.5) * (1 + totalRecords * 0.01) * speedMult,
                radius: type === 'dark' ? 6 : (type === 'jellyfish' ? 15 : (type === 'bubble' ? 12 : (type === 'heart' ? 10 : (isRare ? 5 : 2.5)))),
                color: type === 'dark' ? '#8a2be2' : (type === 'jellyfish' ? '#ff69b4' : (type === 'bubble' ? 'rgba(0, 255, 204, 0.4)' : (type === 'heart' ? '#ff3366' : (isRare ? '#ff69b4' : '#ffeb3b')))),
                alpha: Math.random() * 0.5 + 0.5, pulse: Math.random() * Math.PI, isDark: type === 'dark', isRare: isRare
            });
        }
        for (let i = 0; i < 30; i++) createEntity(); 
        function createExplosion(x, y, color, count = 25) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2, speed = Math.random() * 8 + 2;
                particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, size: Math.random() * 3 + 1, color, alpha: 1, decay: 0.025 });
            }
        }

        document.addEventListener('mousedown', () => {
            if (skillCD > 0 || !gameActive || isPaused) return;
            skillCD = SKILL_MAX_CD; playSkillSound(); shakeTime = 15; 
            shockwaves.push({ x: mouse.x, y: mouse.y, radius: 10, maxRadius: 300, alpha: 1 });
            for (let i = entities.length - 1; i >= 0; i--) {
                let e = entities[i];
                if (Math.sqrt((e.x - mouse.x)**2 + (e.y - mouse.y)**2) < 300) {
                    entities.splice(i, 1);
                    if (e.type === 'dark') { createExplosion(e.x, e.y, '#00ffcc', 40); healingScore += 15; totalRecords += 15; }
                    else { let pts = e.type === 'jellyfish' ? 25 : (e.type === 'bubble' ? 30 : (e.type === 'heart' ? 40 : (e.isRare ? 20 : 8))); createExplosion(e.x, e.y, e.color, 20); healingScore += pts; totalRecords += pts; }
                    createEntity();
                }
            }
        });

        function updateBars() {
            let percent = Math.min((healingScore / currentThreshold) * 100, 100);
            document.getElementById('healingBar').style.width = percent + '%';
            document.getElementById('healingText').innerText = `治愈能量 ${Math.floor(percent)}% (累计治愈: ${totalRecords})`;
            let cdPercent = (1 - skillCD / SKILL_MAX_CD) * 100;
            document.getElementById('skillBar').style.width = cdPercent + '%';
            if (skillCD > 0) { 
                document.getElementById('skillText').innerText = `光波充能中... ${Math.floor(cdPercent)}%`; 
                document.getElementById('skillText').style.color = '#aaa'; 
                document.getElementById('skillBar').style.boxShadow = 'none';
            } else { 
                document.getElementById('skillText').innerText = '✨ 净化光波就绪（点击释放）'; 
                document.getElementById('skillText').style.color = '#00ffcc'; 
                document.getElementById('skillBar').style.boxShadow = '0 0 20px #00ffcc'; 
            }
            updateLevelDisplay();
        }

        function animate() {
            if (!gameActive || isPaused) return;
            requestAnimationFrame(animate);
            if (skillCD > 0) skillCD--;
            updateBars();
            ctx.save();
            if (shakeTime > 0) { ctx.translate((Math.random() - 0.5) * shakeTime, (Math.random() - 0.5) * shakeTime); shakeTime -= 0.5; }
            
            let brightness = Math.min(totalRecords * 0.5, 100);
            let gradient = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, Math.max(width, height));
            gradient.addColorStop(0, `rgb(${brightness*0.8}, ${brightness*0.5}, ${15 + brightness*1.5})`); gradient.addColorStop(1, `rgb(5, 8, 15)`);
            ctx.fillStyle = gradient; ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#ffffff';
            ambientStars.forEach(s => {
                s.y -= s.speed;
                if (s.y < 0) { s.y = height; s.x = Math.random() * width; }
                ctx.globalAlpha = s.alpha;
                ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
            });
            ctx.globalAlpha = 1;

            for (let i = shockwaves.length - 1; i >= 0; i--) { let w = shockwaves[i]; w.radius += 20; w.alpha -= 0.03; if (w.alpha <= 0) { shockwaves.splice(i, 1); continue; } ctx.beginPath(); ctx.arc(w.x, w.y, w.radius, 0, Math.PI * 2); ctx.strokeStyle = `rgba(0, 255, 204, ${w.alpha})`; ctx.lineWidth = 4; ctx.stroke(); }
            
            entities.forEach(e => {
                e.pulse += 0.03; e.x += e.vx; e.y += e.vy;
                if (e.type === 'jellyfish' && e.y < -30) { e.y = height + 30; e.x = Math.random() * width; }
                if (e.type !== 'jellyfish') { if (e.x < 0 || e.x > width) e.vx *= -1; if (e.y < 0 || e.y > height) e.vy *= -1; }
                let alpha = Math.max(0.1, Math.min(1, e.alpha + Math.sin(e.pulse) * 0.3));
                ctx.globalAlpha = alpha; ctx.shadowBlur = 15; 
                
                if (e.type === 'jellyfish') { 
                    ctx.shadowColor = e.color;
                    ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, Math.PI, 0); ctx.fillStyle = e.color; ctx.fill(); ctx.beginPath(); ctx.moveTo(e.x - e.radius, e.y); ctx.lineTo(e.x + e.radius, e.y); ctx.strokeStyle = e.color; ctx.lineWidth = 2; ctx.stroke(); for(let j=-2; j<=2; j+=2) { ctx.beginPath(); ctx.moveTo(e.x + j*4, e.y); ctx.quadraticCurveTo(e.x + j*4, e.y + 15, e.x + j*4 + Math.sin(e.pulse)*5, e.y + 30); ctx.stroke(); } 
                }
                else if (e.type === 'bubble') { 
                    ctx.shadowColor = e.color;
                    ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0, 255, 204, 0.1)'; ctx.fill(); ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(0, 255, 204, 0.6)'; ctx.lineWidth = 2; ctx.stroke(); ctx.beginPath(); ctx.arc(e.x - e.radius*0.4, e.y - e.radius*0.4, e.radius*0.2, 0, Math.PI*2); ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fill(); 
                }
                else if (e.type === 'heart') { 
                    ctx.shadowColor = e.color;
                    let scale = 1 + Math.sin(e.pulse) * 0.15; ctx.save(); ctx.translate(e.x, e.y); ctx.scale(scale, scale); ctx.beginPath(); ctx.moveTo(0, -5); ctx.bezierCurveTo(-10, -15, -20, 0, 0, 15); ctx.bezierCurveTo(20, 0, 10, -15, 0, -5); ctx.fillStyle = e.color; ctx.fill(); ctx.restore(); 
                }
                else { 
                    if (e.isDark) {
                        ctx.fillStyle = '#4a0e4e';
                        ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 15;
                        ctx.beginPath(); ctx.moveTo(e.x - 4, e.y); ctx.quadraticCurveTo(e.x - 18, e.y - 15, e.x - 25, e.y - 5); ctx.quadraticCurveTo(e.x - 15, e.y + 5, e.x - 4, e.y + 5); ctx.fill();
                        ctx.beginPath(); ctx.moveTo(e.x + 4, e.y); ctx.quadraticCurveTo(e.x + 18, e.y - 15, e.x + 25, e.y - 5); ctx.quadraticCurveTo(e.x + 15, e.y + 5, e.x + 4, e.y + 5); ctx.fill();
                        let scale = 1 + Math.sin(e.pulse) * 0.15; ctx.save(); ctx.translate(e.x, e.y); ctx.scale(scale, scale); 
                        ctx.beginPath(); ctx.moveTo(0, -3); ctx.bezierCurveTo(-8, -12, -15, 0, 0, 12); ctx.bezierCurveTo(15, 0, 8, -12, 0, -3); 
                        ctx.fillStyle = '#8a2be2'; ctx.fill(); ctx.restore();
                        ctx.beginPath(); ctx.arc(e.x, e.y, e.radius * 2.5, 0, Math.PI * 2); ctx.strokeStyle = `rgba(255, 0, 0, ${alpha})`; ctx.lineWidth = 2; ctx.stroke(); 
                    } else {
                        ctx.shadowColor = e.color;
                        ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.fillStyle = e.color; ctx.fill(); 
                        if (e.isRare) { ctx.beginPath(); ctx.arc(e.x, e.y, e.radius * 2, 0, Math.PI * 2); ctx.strokeStyle = `rgba(255, 105, 180, ${alpha*0.5})`; ctx.lineWidth = 1; ctx.stroke(); }
                    }
                }
                ctx.globalAlpha = 1; ctx.shadowBlur = 0;
            });
            for (let i = particles.length - 1; i >= 0; i--) { let p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.alpha -= p.decay; if (p.alpha <= 0) particles.splice(i, 1); else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha; ctx.fill(); } }
            ctx.globalAlpha = 1;
            for (let i = floatingTexts.length - 1; i >= 0; i--) { let ft = floatingTexts[i]; ft.y -= 1.5; ft.alpha -= 0.02; if (ft.alpha <= 0) { floatingTexts.splice(i, 1); continue; } ctx.font = 'bold 20px "Microsoft YaHei"'; ctx.fillStyle = ft.color; ctx.globalAlpha = ft.alpha; ctx.textAlign = 'center'; ctx.fillText(ft.text, ft.x, ft.y); }
            ctx.globalAlpha = 1;
            
            let glowRadius = 8 + Math.min(combo * 1.5, 15); 
            ctx.beginPath(); ctx.arc(mouse.x, mouse.y, glowRadius * 1.5, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0, 255, 204, 0.05)'; ctx.fill();
            ctx.beginPath(); ctx.arc(mouse.x, mouse.y, glowRadius, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0, 255, 204, 0.25)'; ctx.fill();
            ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 3, 0, Math.PI * 2); ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#00ffcc'; ctx.shadowBlur = 10 + combo * 1.5; ctx.fill(); 
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 10;
            ctx.beginPath(); ctx.moveTo(mouse.x - 3, mouse.y); ctx.quadraticCurveTo(mouse.x - 15, mouse.y - 15, mouse.x - 20, mouse.y - 5); ctx.quadraticCurveTo(mouse.x - 10, mouse.y + 5, mouse.x - 3, mouse.y + 5); ctx.fill();
            ctx.beginPath(); ctx.moveTo(mouse.x + 3, mouse.y); ctx.quadraticCurveTo(mouse.x + 15, mouse.y - 15, mouse.x + 20, mouse.y - 5); ctx.quadraticCurveTo(mouse.x + 10, mouse.y + 5, mouse.x + 3, mouse.y + 5); ctx.fill();
            ctx.shadowBlur = 0;
            let now = Date.now();
            for (let i = entities.length - 1; i >= 0; i--) {
                let e = entities[i], dx = mouse.x - e.x, dy = mouse.y - e.y;
                let collisionRadius = (e.type === 'dark') ? 20 : (40 + combo);
                if (Math.sqrt(dx*dx + dy*dy) < collisionRadius) { 
                    entities.splice(i, 1); 
                    if (e.type === 'dark') { playDarkSound(); shakeTime = 12; combo = 0; healingScore = Math.max(0, healingScore - 10); totalRecords = Math.max(0, totalRecords - 10); createExplosion(e.x, e.y, '#ff0000', 15); }
                    else if (e.type === 'heart') { playJellyfishSound(); createExplosion(e.x, e.y, '#ff3366', 40); let randomAction = Math.random() < 0.5 ? 'heal' : 'quiz'; if (randomAction === 'heal') { let points = 50; healingScore += points; totalRecords += points; floatingTexts.push({x: e.x, y: e.y, text: `+${points} 治愈值`, alpha: 1, color: '#ff69b4'}); createEntity(); } else { triggerQuiz(); return; } }
                    else { let points = 8; if (e.type === 'jellyfish') { playJellyfishSound(); createExplosion(e.x, e.y, e.color, 35); points = 25; } else if (e.type === 'bubble') { playBubbleSound(); createExplosion(e.x, e.y, '#00ffcc', 30); points = 30; } else { playCollectSound(combo); createExplosion(e.x, e.y, e.color, e.isRare ? 30 : 20); points = e.isRare ? 20 : 8; } if (now - lastCollectTime < 1500) { combo++; } else { combo = 1; } lastCollectTime = now; points += Math.min(combo, 5) * 2; healingScore += points; totalRecords += points; createEntity(); }
                    
                    if (healingScore >= currentThreshold) { 
                        level++;
                        if (level > maxLevel) { maxLevel = level; localStorage.setItem('gameMaxLevel', maxLevel); }
                        SKILL_MAX_CD = Math.min(600 + (level - 1) * 120, 1200); 
                        currentThreshold = Math.floor(100 * Math.pow(1.2, level - 1)); 
                        floatingTexts.push({x: width/2, y: height/2, text: `升级！ Lv.${level}`, alpha: 1, color: '#ffeb3b'});
                        playSound(1046.50, 'square', 1.0, 0.5); 
                        
                        if (messageCount >= QUIZ_TRIGGER_AFTER) { triggerQuiz(); return; } 
                        else { playMessageSound(); triggerWarmMessage(); messageCount++; healingScore = 0; combo = 0; }
                    }
                }
            }
            ctx.restore();
        }

        function triggerQuiz() {
            gameActive = false;
            const modal = document.getElementById('quizModal'), qText = document.getElementById('quizQuestion'), optionsContainer = document.getElementById('quizOptions'), resultText = document.getElementById('quizResult');
            const quiz = quizQuestions[Math.floor(Math.random() * quizQuestions.length)];
            let currentQuizAnswer = quiz.answer;
            qText.innerText = quiz.question; optionsContainer.innerHTML = ''; resultText.innerText = '';
            quiz.options.forEach((opt, index) => { const btn = document.createElement('button'); btn.className = 'quiz-option'; btn.innerText = opt; btn.onclick = () => checkQuizAnswer(index, currentQuizAnswer); optionsContainer.appendChild(btn); });
            modal.style.display = 'flex'; void modal.offsetWidth; modal.classList.add('show');
        }

        function checkQuizAnswer(selectedIndex, correctIndex) {
            const resultText = document.getElementById('quizResult'), options = document.querySelectorAll('.quiz-option');
            options.forEach(btn => btn.style.pointerEvents = 'none');
            if (selectedIndex === correctIndex) {
                resultText.innerText = "✅ 回答正确！记录保留，继续加油吧~"; resultText.className = "quiz-result result-correct";
                playJellyfishSound(); messageCount = 0; 
                setTimeout(() => { document.getElementById('quizModal').classList.remove('show'); setTimeout(() => { document.getElementById('quizModal').style.display = 'none'; gameActive = true; createEntity(); animate(); }, 500); }, 1500);
            } else {
                const randomAngry = angryEmojis[Math.floor(Math.random() * angryEmojis.length)];
                resultText.innerHTML = `❌ 回答错误！<br><span style="font-size: 28px;">${randomAngry}</span><br>记录清零，从头开始！`;
                resultText.className = "quiz-result result-wrong"; playDarkSound(); shakeTime = 20;
                setTimeout(() => { document.getElementById('quizModal').classList.remove('show'); setTimeout(() => { document.getElementById('quizModal').style.display = 'none'; resetGame(); }, 500); }, 2500);
            }
        }

        function resetGame() {
            healingScore = 0; totalRecords = 0; combo = 0; messageCount = 0; level = 1; currentThreshold = 100; SKILL_MAX_CD = 600;
            entities = []; particles = []; shockwaves = []; floatingTexts = []; gameActive = true; isPaused = false;
            for (let i = 0; i < 30; i++) createEntity(); updateBars(); animate();
        }

        function triggerWarmMessage() {
             gameActive = false;
            const randomMsg = myPersonalMessages[Math.floor(Math.random() * myPersonalMessages.length)];
            const textContainer = document.getElementById('warmText'), modal = document.getElementById('modal');
            textContainer.innerHTML = ''; modal.style.display = 'flex'; void modal.offsetWidth; modal.classList.add('show');
            const chars = randomMsg.split('');
            chars.forEach((char, index) => { const span = document.createElement('span'); span.className = 'char-span'; span.innerText = char; const centerIndex = Math.floor(chars.length / 2); const delay = Math.abs(index - centerIndex) * 20; span.style.animation = `jumpIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) ${delay}ms forwards, waveFloat 2s ease-in-out ${delay + 600}ms infinite`; textContainer.appendChild(span); });
            const totalAnimTime = 2000;
            setTimeout(() => { if (modal.classList.contains('show')) closeModal(); }, totalAnimTime);
        }

        function closeModal() {
            const modal = document.getElementById('modal'); modal.classList.remove('show');
            setTimeout(() => { modal.style.display = 'none'; gameActive = true; animate(); }, 500);
        }

        let isHidden = false;
        document.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                isHidden = !isHidden;
                canvas.style.display = isHidden ? 'none' : 'block'; document.getElementById('hintBar').style.display = isHidden ? 'none' : 'block';
                document.getElementById('healingBarContainer').style.display = isHidden ? 'none' : 'block'; document.getElementById('healingText').style.display = isHidden ? 'none' : 'block';
                document.getElementById('skillBarContainer').style.display = isHidden ? 'none' : 'block'; document.getElementById('skillText').style.display = isHidden ? 'none' : 'block';
                document.getElementById('levelBadge').style.display = isHidden ? 'none' : 'block';
                document.getElementById('fakeScreen').style.display = isHidden ? 'block' : 'none';
                document.getElementById('modal').style.display = 'none'; document.getElementById('quizModal').style.display = 'none';
                isPaused = isHidden; if (!isHidden && gameActive) animate();
            }
        });
        animate();
    </script>
</body>
