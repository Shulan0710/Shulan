<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>数据录入中...</title>
    <style>
        body { margin: 0; background-color: #1e1e1e; color: white; font-family: "Microsoft YaHei", sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #gameContainer { position: relative; text-align: center; }
        canvas { background-color: #2d2d2d; border: 2px solid #4CAF50; border-radius: 8px; box-shadow: 0 0 25px rgba(76, 175, 80, 0.5); cursor: pointer; }
        #scoreBoard { margin-bottom: 10px; font-size: 20px; font-weight: bold; color: #4CAF50; text-shadow: 0 0 10px #4CAF50; }
        #hint { margin-top: 10px; font-size: 14px; color: #aaa; }
        #fakeScreen { display: none; width: 100vw; height: 100vh; background-color: #f3f3f3; color: #333; padding: 50px; font-size: 20px; position: absolute; top: 0; left: 0; box-sizing: border-box; z-index: 10; }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div id="scoreBoard">得分: <span id="score">0</span> | 最高分: <span id="highScore">0</span></div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="hint">使用 ⬆️ ⬇️ ⬅️ ➡️ 方向键控制 | 按 'H' 键伪装 | 死亡后点击屏幕重开</div>
    </div>

    <div id="fakeScreen">
        <h2>📝 正在同步企业数据库...</h2>
        <hr>
        <p>正在处理第 408 项数据...</p >
        <p>进度：<span id="fakeProgress">45</span>%</p >
        <p>（按 'H' 键返回游戏）</p >
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');

        const gridSize = 20; 
        const tileCount = canvas.width / gridSize; 
        let score = 0;
        
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        highScoreEl.innerText = highScore;

        let snake = [];
        let dx = 0; 
        let dy = -1; 
        let food = {x: 15, y: 10};
        
        let gameLoop;
        let gameSpeed = 120; 
        let isPaused = false; 
        let gameActive = true; 
        let shakeTime = 0; 
        
        // 粒子系统（用于满屏飘 Emoji）
        let particles = [];
        let particleLoop;

        const funnyMessages = [
            "爱你呀！",
            "哦哦还挺厉害的哼哼！",
            "我靠这么强！",
            "日常提醒：立刻马上喝100ml水！",
            "嘿嘿爱老虎油！"
        ];

        const emojiPool = ['❤️', '🥰', '🤩', '💧', '🐍', '🎉', '😂', '💪', '🌟', '🥤', '🎮', '🌺'];

        function initGame() {
            // 清除上一局的粒子特效和动画帧
            particles = [];
            if (particleLoop) cancelAnimationFrame(particleLoop);

            snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
            dx = 0; dy = -1;
            score = 0;
            scoreEl.innerText = score;
            gameActive = true;
            shakeTime = 0;
            generateFood();
            clearInterval(gameLoop);
            gameLoop = setInterval(drawGame, gameSpeed);
        }

        function drawGame() {
            if (isPaused || !gameActive) return; 

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) return gameOver();
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) return gameOver();
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.innerText = score;
                generateFood();
            } else {
                snake.pop(); 
            }

            ctx.save(); 
            
            if (shakeTime > 0) {
                const shakeX = (Math.random() - 0.5) * 8 * shakeTime;
                const shakeY = (Math.random() - 0.5) * 8 * shakeTime;
                ctx.translate(shakeX, shakeY);
                shakeTime -= 0.5; 
            }

            ctx.fillStyle = '#2d2d2d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 发光的食物
            ctx.shadowColor = '#ff4d4d';
            ctx.shadowBlur = 15; 
            ctx.fillStyle = '#ff4d4d';
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0; 

            // 画蛇
            snake.forEach((segment, index) => {
                if (index === 0) {
                    ctx.shadowColor = '#00ffcc';
                    ctx.shadowBlur = 10;
                    ctx.fillStyle = '#00ffcc';
                } else {
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = index % 2 === 0 ? '#4CAF50' : '#45a049';
                }
                ctx.beginPath();
                ctx.roundRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2, 4);
                ctx.fill();
            });
            
            ctx.restore(); 
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) return generateFood();
            }
        }

        function gameOver() {
            gameActive = false;
            shakeTime = 10; 
            clearInterval(gameLoop);
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreEl.innerText = highScore;
            }

            // 获取死亡位置（蛇头位置）
            const deadX = snake[0].x * gridSize;
            const deadY = snake[0].y * gridSize;

            setTimeout(() => {
                // 生成从死亡点爆炸的 Emoji 粒子（60个，数量适中不卡顿）
                particles = [];
                for (let i = 0; i < 60; i++) {
                    const angle = Math.random() * Math.PI * 2; // 360度全方位
                    const speed = 2 + Math.random() * 6; // 爆炸速度
                    particles.push({
                        x: deadX + gridSize/2,
                        y: deadY + gridSize/2,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - 2, // 稍微向上偏一点
                        text: emojiPool[Math.floor(Math.random() * emojiPool.length)],
                        size: 15 + Math.random() * 20,
                        alpha: 1,
                        decay: 0.02 + Math.random() * 0.03 // 快速消散
                    });
                }
                
                animateParticles();
            }, 150); 
        }

        // 粒子动画（爆炸后快速消失）
        function animateParticles() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2; // 模拟重力，让它们向下掉落
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(i, 1); 
                } else {
                    ctx.globalAlpha = p.alpha;
                    ctx.font = p.size + 'px "Microsoft YaHei"';
                    ctx.fillText(p.text, p.x, p.y);
                }
            }
            ctx.globalAlpha = 1; 

            const randomMsg = funnyMessages[Math.floor(Math.random() * funnyMessages.length)];
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 30px "Microsoft YaHei"';
            ctx.fillText('得分: ' + score, canvas.width / 2, canvas.height / 2 - 60);

            ctx.shadowColor = '#ff69b4';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#ff69b4'; 
            ctx.font = 'bold 22px "Microsoft YaHei"';
            ctx.fillText(randomMsg, canvas.width / 2, canvas.height / 2);

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#aaaaaa';
            ctx.font = '16px "Microsoft YaHei"';
            ctx.fillText('点击屏幕重新开始', canvas.width / 2, canvas.height / 2 + 60);

            if (particles.length > 0) {
                particleLoop = requestAnimationFrame(animateParticles);
            }
        }

        canvas.addEventListener('click', () => {
            if (!gameActive) initGame();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                isPaused = !isPaused;
                document.getElementById('gameContainer').style.display = isPaused ? 'none' : 'block';
                document.getElementById('fakeScreen').style.display = isPaused ? 'block' : 'none';
                return;
            }
            if (!gameActive) return; 
            if (e.key === 'ArrowUp' && dy !== 1) { dx = 0; dy = -1; }
            if (e.key === 'ArrowDown' && dy !== -1) { dx = 0; dy = 1; }
            if (e.key === 'ArrowLeft' && dx !== 1) { dx = -1; dy = 0; }
            if (e.key === 'ArrowRight' && dx !== -1) { dx = 1; dy = 0; }
        });

        setInterval(() => {
            if(isPaused) {
                let p = document.getElementById('fakeProgress');
                let val = parseInt(p.innerText);
                p.innerText = val >= 99 ? 45 : val + 1;
            }
        }, 1000);

        initGame();
    </script>
</body>
</html>
